# Start on boot
exec_once = awww-daemon
#exec_once = sleep 1 && bash $HOME/.config/Scripts/random_wall_on_home.sh
exec_once = foot --server
exec_once = blueman-applet >/dev/null 2>&1 &
exec_once = "awww img ~/.config/niri/wall.jpg --transition-type any --transition-step 5 --transition-fps 165 --transition-duration 2"
exec_once = "mpd"
exec_once = "mpDris2"
exec_once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 &
exec_once = wl-paste --type image --watch cliphist store
exec_once = wl-paste --type text --watch cliphist store
exec_once = kitty -1 --start-as=hidden 2>&1
# night light
exec_once = wlsunset -T 3501 -t 3500 >/dev/null 2>&1 &
