"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
command_timeout = 200

[line_break]
disabled = true

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$python\
$line_break$character"""

[directory]
style = "blue"
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bold cyan"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[character]
format = "$symbol "
success_symbol = "[󰊠](bold italic bright-red)"
error_symbol = "[○](italic purple)"
vimcmd_symbol = "[󱙝](italic dimmed green)"

[git_branch]
format = "[$symbol](fg:#f2cdcd)[$branch]($style) "
style = "bright-black"
symbol = " "

[git_status]
format     = '[$all_status]($style)'
style      = "cyan"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
show_milliseconds = false
format = "[ $duration](fg:yellow) "
disabled = false
show_notifications = false
min_time_to_notify = 45000

[python]
format = "[$virtualenv]($style) "
style = "bright-black"
detect_extensions = []
detect_files = []
